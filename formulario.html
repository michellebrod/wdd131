<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulário de avaliação de produtos: escolha o produto, dê uma nota de 1 a 5 estrelas e compartilhe sua experiência.">
  <meta name="author" content="Michelle Barbosa Rodrigues Amorim">
  <title>Avaliação do Produto | Michelle Amorim | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/formulario.css">
  <script src="scripts/formulario.js" defer></script>
</head>
<body>
  <header>
    <h1>Avaliação do Produto</h1>
  </header>

  <main>
    <form action="avaliacao.html" method="get">
      <div class="campo">
        <label for="produto">Nome do Produto <span class="obrigatorio" aria-hidden="true">*</span></label>
        <select id="produto" name="produto" required>
          <option value="" disabled selected>Selecione um Produto...</option>
        </select>
      </div>

      <fieldset class="campo classificacao">
        <legend>Classificação Geral <span class="obrigatorio" aria-hidden="true">*</span></legend>
        <div class="opcoes-estrelas">
          <div class="opcao-estrela">
            <label for="nota1"><span aria-hidden="true">☆</span><span class="sr-only">1 estrela</span></label>
            <input type="radio" id="nota1" name="classificacao" value="1" required>
          </div>
          <div class="opcao-estrela">
            <label for="nota2"><span aria-hidden="true">☆☆</span><span class="sr-only">2 estrelas</span></label>
            <input type="radio" id="nota2" name="classificacao" value="2" required>
          </div>
          <div class="opcao-estrela">
            <label for="nota3"><span aria-hidden="true">☆☆☆</span><span class="sr-only">3 estrelas</span></label>
            <input type="radio" id="nota3" name="classificacao" value="3" required>
          </div>
          <div class="opcao-estrela">
            <label for="nota4"><span aria-hidden="true">☆☆☆☆</span><span class="sr-only">4 estrelas</span></label>
            <input type="radio" id="nota4" name="classificacao" value="4" required>
          </div>
          <div class="opcao-estrela">
            <label for="nota5"><span aria-hidden="true">☆☆☆☆☆</span><span class="sr-only">5 estrelas</span></label>
            <input type="radio" id="nota5" name="classificacao" value="5" required>
          </div>
        </div>
      </fieldset>

      <div class="campo">
        <label for="dataInstalacao">Data de Instalação <span class="obrigatorio" aria-hidden="true">*</span></label>
        <input type="date" id="dataInstalacao" name="dataInstalacao" required>
      </div>

      <fieldset class="campo recursos">
        <legend>Quais recursos você achou úteis no produto?<span class="instrucao">(Marque todos os que se aplicam)</span></legend>
        <label for="durabilidade"><input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade"> Durabilidade</label>
        <label for="facilidade"><input type="checkbox" id="facilidade" name="recursos" value="Facilidade de Uso"> Facilidade de Uso</label>
        <label for="desempenho"><input type="checkbox" id="desempenho" name="recursos" value="Desempenho"> Desempenho</label>
        <label for="design"><input type="checkbox" id="design" name="recursos" value="Design"> Design</label>
      </fieldset>

      <div class="campo">
        <label for="avaliacaoEscrita">Avaliação Escrita <span class="opcional">(Opcional)</span></label>
        <textarea id="avaliacaoEscrita" name="avaliacaoEscrita" rows="5" placeholder="Conte-nos sua experiência com o produto"></textarea>
      </div>

      <div class="campo">
        <label for="nomeUsuario">Seu Nome <span class="opcional">(Opcional)</span></label>
        <input type="text" id="nomeUsuario" name="nomeUsuario" autocomplete="name">
      </div>

      <input type="submit" value="Publicar Avaliação">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="anoAtual"></span> 🌸 Michelle Barbosa Rodrigues Amorim 🌸 Brasil</p>
    <p id="ultimaModificacao"></p>
  </footer>
</body>
</html>
